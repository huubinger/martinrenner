<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>martinrenner.de</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    overflow: hidden;
  }

  .top-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 1.3rem;
    padding: 1.1rem 1.5rem;
    background: linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0) 100%);
    overflow-x: auto;
    white-space: nowrap;
  }
  .top-nav button,
  .top-nav a {
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    padding: 0.3rem 0;
    position: relative;
    flex: 0 0 auto;
  }
  .top-nav button:hover,
  .top-nav a:hover { color: #f8fafc; }
  .top-nav button.active { color: #38bdf8; }
  .top-nav button.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 2px;
    background: #38bdf8;
    border-radius: 1px;
  }
  .top-nav .nav-divider {
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.2);
    flex: 0 0 auto;
  }

  .slideshow {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .slide.active { opacity: 1; z-index: 1; }

  /* Unscharfe Cover-Backdrop, füllt auf schmalen Screens die Ränder statt das Foto extrem zu beschneiden */
  .slide-bg-blur {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(24px) brightness(0.55);
    display: none;
  }
  .slide-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  @media (max-width: 700px) {
    .slide-bg-blur { display: block; }
    .slide-photo { background-size: contain; background-repeat: no-repeat; background-position: center; }
  }

  /* Platzhalter-Grafik je Kategorie, solange keine echten Fotos hinterlegt sind */
  .slide-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.75rem;
  }
  .slide-placeholder .ph-icon {
    font-size: 3rem;
    opacity: 0.35;
  }
  .slide-placeholder .ph-label {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* Abdunklung für Lesbarkeit des Banners */
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* Sechs Farbwelten als Platzhalter-Hintergrund je Kategorie */
  .grad-martin-renner { background: linear-gradient(135deg, #1e293b, #334155); }
  .grad-kreatief-musical { background: linear-gradient(135deg, #4c1d95, #7c3aed); }
  .grad-voctails { background: linear-gradient(135deg, #0e7490, #06b6d4); }
  .grad-lauter-maenner { background: linear-gradient(135deg, #7c2d12, #ea580c); }
  .grad-fruehstuecks-choerle { background: linear-gradient(135deg, #14532d, #22c55e); }
  .grad-veranstaltungstechnik { background: linear-gradient(135deg, #1e293b, #0f172a); }

  .banner {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    padding: 2.5rem 2rem 3.5rem;
    max-width: 720px;
  }
  .banner .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 0.6rem;
  }
  .banner h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }
  .banner p.info {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: #e2e8f0;
    margin-bottom: 1.1rem;
    max-width: 560px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .banner .actions {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
  }
  .banner .link-btn,
  .banner .social-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .banner .link-btn {
    background: #38bdf8;
    color: #0f172a;
  }
  .banner .link-btn:hover { background: #0ea5e9; }
  .banner .link-btn svg { display: block; }
  .banner .info-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.55rem 1.05rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #f8fafc;
    font-weight: 600;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  .banner .info-btn:hover { background: rgba(255,255,255,0.16); }
  .banner .info-btn svg { display: block; }
  .banner .socials {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .banner .social-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #f8fafc;
  }
  .banner .social-btn:hover {
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.5);
  }
  .banner .social-btn svg { display: block; }

  .info-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15,23,42,0.75);
    backdrop-filter: blur(4px);
    padding: 1.5rem;
  }
  .info-modal-overlay.open { display: flex; }
  .info-modal {
    position: relative;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 2rem 1.8rem 1.8rem;
  }
  .info-modal h2 { font-size: 1.3rem; margin-bottom: 0.8rem; padding-right: 1.5rem; }
  .info-modal p { color: #e2e8f0; line-height: 1.6; white-space: pre-line; }
  .info-modal-close {
    position: absolute;
    top: 0.9rem;
    right: 0.9rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #f8fafc;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }
  .info-modal-close:hover { background: rgba(255,255,255,0.18); }

  .legal-footer {
    position: fixed;
    right: 1rem;
    bottom: 0.75rem;
    z-index: 10;
    display: flex;
    gap: 0.9rem;
    font-size: 0.78rem;
  }
  .legal-footer a {
    color: rgba(255,255,255,0.55);
    text-decoration: none;
  }
  .legal-footer a:hover { color: #f8fafc; }

  .cookie-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem 1.2rem;
    background: rgba(15,23,42,0.97);
    border-top: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
  }
  .cookie-banner p {
    color: #e2e8f0;
    font-size: 0.85rem;
    max-width: 640px;
    line-height: 1.5;
    margin: 0;
  }
  .cookie-banner a { color: #38bdf8; }
  .cookie-banner button {
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .cookie-banner button:hover { background: #0ea5e9; }

  @media (max-width: 560px) {
    .banner { padding: 1.8rem 1.2rem 4.5rem; }
  }

  @media (max-width: 700px) {
    .top-nav {
      flex-wrap: wrap;
      overflow-x: visible;
      white-space: normal;
      padding: 0.8rem 1rem;
      gap: 0.5rem 0.9rem;
      row-gap: 0.4rem;
      background: rgba(15,23,42,0.72);
      backdrop-filter: blur(6px);
    }
    .top-nav .nav-divider { display: none; }
    .top-nav button,
    .top-nav a { font-size: 0.8rem; padding: 0.15rem 0; }
  }

  .news-box {
    position: fixed;
    top: 4.6rem;
    right: 1.5rem;
    z-index: 6;
    width: 260px;
    max-height: 44vh;
    overflow-y: auto;
    background: rgba(15,23,42,0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    backdrop-filter: blur(8px);
    display: none;
  }
  .news-box h2 {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 0.7rem;
  }
  .news-item {
    padding-bottom: 0.7rem;
    margin-bottom: 0.7rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .news-date { font-size: 0.68rem; color: #64748b; margin-bottom: 0.2rem; }
  .news-title { font-size: 0.88rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.15rem; }
  .news-text { font-size: 0.83rem; color: #e2e8f0; line-height: 1.4; }
  .news-link { display: inline-block; margin-top: 0.3rem; font-size: 0.76rem; color: #38bdf8; text-decoration: none; }
  .news-link:hover { text-decoration: underline; }

  .newsletter-box {
    position: fixed;
    right: 1rem;
    bottom: 3rem;
    z-index: 11;
    display: none;
    width: 230px;
    background: rgba(15,23,42,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    backdrop-filter: blur(6px);
  }
  .newsletter-close {
    position: absolute;
    top: 0.4rem;
    right: 0.5rem;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
  }
  .newsletter-close:hover { color: #f8fafc; }
  .newsletter-text { font-size: 0.82rem; color: #f8fafc; margin-bottom: 0.5rem; padding-right: 1rem; }
  .newsletter-form { display: flex; gap: 0.4rem; }
  .newsletter-form input {
    flex: 1;
    min-width: 0;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #f8fafc;
    font-size: 0.78rem;
    font-family: inherit;
  }
  .newsletter-form button {
    padding: 0.45rem 0.7rem;
    border-radius: 6px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .newsletter-form button:hover { background: #0ea5e9; }
  .newsletter-msg { font-size: 0.72rem; color: #94a3b8; margin-top: 0.4rem; min-height: 1em; }

  @media (max-width: 700px) {
    .news-box { display: none !important; }
  }
  @media (max-width: 900px) {
    .newsletter-box { display: none !important; }
  }
</style>
</head>
<body>

  <nav class="top-nav" id="top-nav"></nav>

  <div class="slideshow" id="slideshow"></div>

  <div class="banner">
    <div class="eyebrow" id="banner-eyebrow">Projekt</div>
    <h1 id="banner-title"></h1>
    <p class="info" id="banner-info"></p>
    <div class="actions">
      <a class="link-btn" id="banner-link" href="#">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        Homepage
      </a>
      <button type="button" class="info-btn" id="banner-info-btn" style="display:none;"></button>
      <div class="socials" id="banner-socials"></div>
    </div>
  </div>

  <div class="info-modal-overlay" id="info-modal-overlay">
    <div class="info-modal">
      <button type="button" class="info-modal-close" id="info-modal-close" aria-label="Schließen">&times;</button>
      <h2 id="info-modal-title"></h2>
      <p id="info-modal-text"></p>
    </div>
  </div>

  <div class="news-box" id="news-box">
    <h2>📰 News</h2>
    <div id="news-list"></div>
  </div>

  <div class="newsletter-box" id="newsletter-box">
    <button type="button" class="newsletter-close" id="newsletter-close" aria-label="Schließen">&times;</button>
    <p class="newsletter-text">📬 Newsletter abonnieren</p>
    <form id="newsletter-form" class="newsletter-form">
      <input type="email" name="email" id="newsletter-email" placeholder="deine@email.de" required>
      <button type="submit">Anmelden</button>
    </form>
    <p class="newsletter-msg" id="newsletter-msg"></p>
  </div>

  <div class="legal-footer">
    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
    <a href="/kontakt">Kontakt</a>
  </div>

  <div class="cookie-banner" id="cookie-banner">
    <p>Diese Website verwendet ausschließlich technisch notwendige Funktionen – keine Cookies zu Tracking- oder Marketingzwecken. Mehr dazu in der <a href="/datenschutz.html">Datenschutzerklärung</a>.</p>
    <button id="cookie-banner-ok">Verstanden</button>
  </div>
  <script>
    (function () {
      var KEY = 'cookie_notice_ack_v1';
      var banner = document.getElementById('cookie-banner');
      if (banner && !localStorage.getItem(KEY)) {
        banner.style.display = 'flex';
      }
      var btn = document.getElementById('cookie-banner-ok');
      if (btn) {
        btn.addEventListener('click', function () {
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          banner.style.display = 'none';
        });
      }
    })();
  </script>

  <script>
    // News-Shoutbox: lädt kurze Meldungen vom Server und zeigt sie rechts an.
    (function () {
      function escapeHtmlLocal(str) {
        return String(str).replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }
      fetch('/api/news')
        .then((r) => r.json())
        .then((items) => {
          if (!Array.isArray(items) || !items.length) return;
          const box = document.getElementById('news-box');
          const list = document.getElementById('news-list');
          list.innerHTML = items
            .map((n) => {
              const date = n.createdAt ? new Date(n.createdAt).toLocaleDateString('de-DE') : '';
              const title = n.title ? `<div class="news-title">${escapeHtmlLocal(n.title)}</div>` : '';
              const textEl = `<div class="news-text">${escapeHtmlLocal(n.text)}</div>`;
              const linkEl = n.link
                ? `<a class="news-link" href="${escapeHtmlLocal(n.link)}" target="_blank" rel="noopener">Mehr &rarr;</a>`
                : '';
              return `<div class="news-item"><div class="news-date">${escapeHtmlLocal(date)}</div>${title}${textEl}${linkEl}</div>`;
            })
            .join('');
          box.style.display = 'block';
        })
        .catch(() => {});
    })();
  </script>

  <script>
    // Newsletter-Banner: E-Mail-Anmeldung direkt in den Mailchimp-Verteiler.
    (function () {
      var KEY = 'newsletter_dismissed_v1';
      var box = document.getElementById('newsletter-box');
      if (!box) return;
      if (localStorage.getItem(KEY)) return;
      box.style.display = 'block';
      var closeBtn = document.getElementById('newsletter-close');
      var form = document.getElementById('newsletter-form');
      var msg = document.getElementById('newsletter-msg');
      closeBtn.addEventListener('click', function () {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        box.style.display = 'none';
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('newsletter-email').value;
        msg.textContent = 'Wird gesendet …';
        fetch('/api/newsletter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'email=' + encodeURIComponent(email),
        })
          .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
          .then((result) => {
            if (result.ok && result.data.ok) {
              msg.textContent = 'Danke fürs Abonnieren!';
              form.style.display = 'none';
              try { localStorage.setItem(KEY, '1'); } catch (e) {}
            } else {
              msg.textContent = (result.data && result.data.error) || 'Anmeldung fehlgeschlagen.';
            }
          })
          .catch(() => {
            msg.textContent = 'Anmeldung fehlgeschlagen. Bitte später erneut versuchen.';
          });
      });
    })();
  </script>

  <script>
    // Projektdaten kommen jetzt live vom Server (siehe /admin zum Verwalten).
    let slides = [];

    const slideshowEl = document.getElementById('slideshow');
    const topNavEl = document.getElementById('top-nav');
    const bannerEyebrow = document.getElementById('banner-eyebrow');
    const bannerTitle = document.getElementById('banner-title');
    const bannerInfo = document.getElementById('banner-info');
    const bannerLink = document.getElementById('banner-link');
    const bannerSocials = document.getElementById('banner-socials');
    const bannerInfoBtn = document.getElementById('banner-info-btn');
    const infoModalOverlay = document.getElementById('info-modal-overlay');
    const infoModalTitle = document.getElementById('info-modal-title');
    const infoModalText = document.getElementById('info-modal-text');
    const infoModalClose = document.getElementById('info-modal-close');

    const ICON_INFO = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';

    const SOCIAL_ICONS = {
      instagram: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>',
      facebook: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>',
      youtube: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>',
      fallback: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>',
    };

    function socialIcon(label) {
      const key = String(label || '').toLowerCase();
      if (key.indexOf('instagram') !== -1) return SOCIAL_ICONS.instagram;
      if (key.indexOf('facebook') !== -1) return SOCIAL_ICONS.facebook;
      if (key.indexOf('youtube') !== -1) return SOCIAL_ICONS.youtube;
      return SOCIAL_ICONS.fallback;
    }

    function escapeHtmlClient(str) {
      return String(str).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function hashHue(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return h % 360;
    }

    function placeholderGradient(str) {
      const hue = hashHue(str);
      return `linear-gradient(135deg, hsl(${hue},55%,22%), hsl(${(hue + 40) % 360},55%,32%))`;
    }

    const slideEls = [];
    const navItemEls = [];
    let current = 0;
    let timer = null;

    function buildDOM() {
      slideshowEl.innerHTML = '';
      topNavEl.innerHTML = '';
      slideEls.length = 0;
      navItemEls.length = 0;

      slides.forEach((s, i) => {
        const key = s.id || s.key || s.title;
        const div = document.createElement('div');
        div.className = 'slide' + (i === 0 ? ' active' : '');
        div.dataset.key = key;
        if (s.image) {
          div.innerHTML = `<div class="slide-bg-blur" style="background-image:url(${s.image})"></div><div class="slide-photo" style="background-image:url(${s.image})"></div>`;
        } else {
          const grad = placeholderGradient(key);
          div.innerHTML = `<div class="slide-placeholder" style="background: ${grad};">
            <div class="ph-icon">${escapeHtmlClient(s.icon || '🔹')}</div>
            <div class="ph-label">Foto-Platzhalter · ${escapeHtmlClient(s.title)}</div>
          </div>`;
        }
        slideshowEl.appendChild(div);
        slideEls.push(div);

        const navItem = document.createElement('button');
        navItem.type = 'button';
        navItem.className = 'nav-item' + (i === 0 ? ' active' : '');
        navItem.textContent = s.title;
        navItem.addEventListener('click', () => goTo(i));
        topNavEl.appendChild(navItem);
        navItemEls.push(navItem);
      });

      const divider = document.createElement('span');
      divider.className = 'nav-divider';
      topNavEl.appendChild(divider);

      const contactLink = document.createElement('a');
      contactLink.className = 'nav-item nav-contact';
      contactLink.href = '/kontakt';
      contactLink.textContent = 'Kontakt';
      topNavEl.appendChild(contactLink);
    }

    function updateInfoAffordance(s) {
      const hasDetails = !!(s.details && s.details.trim());
      requestAnimationFrame(() => {
        const truncated = bannerInfo.scrollHeight > bannerInfo.clientHeight + 2;
        if (hasDetails || truncated) {
          bannerInfoBtn.style.display = 'inline-flex';
          bannerInfoBtn.innerHTML = ICON_INFO + '<span>' + (hasDetails ? 'Infos' : 'weiterlesen') + '</span>';
        } else {
          bannerInfoBtn.style.display = 'none';
        }
      });
    }

    function render() {
      if (!slides.length) return;
      slideEls.forEach((el, i) => el.classList.toggle('active', i === current));
      navItemEls.forEach((el, i) => el.classList.toggle('active', i === current));
      const s = slides[current];
      bannerEyebrow.textContent = s.eyebrow || '';
      bannerTitle.textContent = s.title || '';
      bannerInfo.textContent = s.info || '';
      const hasLink = !!(s.link && s.link !== '#');
      bannerLink.style.display = hasLink ? 'inline-flex' : 'none';
      bannerLink.href = hasLink ? s.link : '#';
      bannerSocials.innerHTML = (s.socials || [])
        .map((soc) => `<a class="social-btn" href="${escapeHtmlClient(soc.href)}" target="_blank" rel="noopener">${socialIcon(soc.label)}<span>${escapeHtmlClient(soc.label)}</span></a>`)
        .join('');
      updateInfoAffordance(s);
    }

    function openInfoModal() {
      const s = slides[current];
      if (!s) return;
      infoModalTitle.textContent = s.title || '';
      infoModalText.textContent = (s.details && s.details.trim()) ? s.details : (s.info || '');
      infoModalOverlay.classList.add('open');
    }

    function closeInfoModal() {
      infoModalOverlay.classList.remove('open');
    }

    bannerInfoBtn.addEventListener('click', openInfoModal);
    infoModalClose.addEventListener('click', closeInfoModal);
    infoModalOverlay.addEventListener('click', (e) => {
      if (e.target === infoModalOverlay) closeInfoModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeInfoModal();
    });

    function goTo(i) {
      current = i;
      render();
      // Karussell anhalten, sobald der Besucher aktiv über die Navigation wechselt.
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function next() {
      current = (current + 1) % slides.length;
      render();
    }

    function restart() {
      if (timer) clearInterval(timer);
      if (slides.length > 1) timer = setInterval(next, 6000);
    }

    async function loadSlides() {
      try {
        const res = await fetch('/api/projects');
        slides = await res.json();
      } catch (e) {
        slides = [];
      }
      if (!slides.length) return;
      buildDOM();
      current = 0;
      render();
      restart();
    }

    loadSlides();
  </script>
</body>
</html>
