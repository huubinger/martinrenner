<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>martinrenner.de</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    overflow: hidden;
  }

  .slideshow {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.2s ease;
    background-size: cover;
    background-position: center;
  }
  .slide.active { opacity: 1; z-index: 1; }

  /* Platzhalter-Grafik je Kategorie, solange keine echten Fotos hinterlegt sind */
  .slide-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.75rem;
  }
  .slide-placeholder .ph-icon {
    font-size: 3rem;
    opacity: 0.35;
  }
  .slide-placeholder .ph-label {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* Abdunklung für Lesbarkeit des Banners */
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* Sechs Farbwelten als Platzhalter-Hintergrund je Kategorie (für Slide + Thumbnail) */
  .grad-martin-renner { background: linear-gradient(135deg, #1e293b, #334155); }
  .grad-kreatief-musical { background: linear-gradient(135deg, #4c1d95, #7c3aed); }
  .grad-voctails { background: linear-gradient(135deg, #0e7490, #06b6d4); }
  .grad-lauter-maenner { background: linear-gradient(135deg, #7c2d12, #ea580c); }
  .grad-fruehstuecks-choerle { background: linear-gradient(135deg, #14532d, #22c55e); }
  .grad-veranstaltungstechnik { background: linear-gradient(135deg, #1e293b, #0f172a); }

  .banner {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    padding: 2.5rem 2rem 3.5rem;
    max-width: 720px;
  }
  .banner .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 0.6rem;
  }
  .banner h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }
  .banner p.info {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: #e2e8f0;
    margin-bottom: 1.1rem;
    max-width: 560px;
  }
  .banner .actions {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    flex-wrap: wrap;
  }
  .banner .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .banner .link-btn:hover { background: #0ea5e9; }
  .banner .socials {
    display: flex;
    gap: 0.7rem;
  }
  .banner .socials a {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f8fafc;
    text-decoration: none;
    font-size: 0.85rem;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .banner .socials a:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.6);
  }

  .thumb-nav {
    position: absolute;
    top: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    gap: 0.55rem;
    padding: 0.5rem;
    background: rgba(15,23,42,0.45);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    max-width: 94vw;
    overflow-x: auto;
  }
  .thumb {
    position: relative;
    width: 78px;
    height: 52px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    flex: 0 0 auto;
    border: 2px solid transparent;
    background-size: cover;
    background-position: center;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .thumb:hover { transform: translateY(-2px); }
  .thumb.active { border-color: #38bdf8; }
  .thumb .thumb-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    opacity: 0.6;
  }
  .thumb .thumb-label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    font-size: 0.52rem;
    line-height: 1.2;
    padding: 2px 3px;
    background: rgba(0,0,0,0.6);
    color: #f8fafc;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legal-footer {
    position: fixed;
    right: 1rem;
    bottom: 0.75rem;
    z-index: 10;
    display: flex;
    gap: 0.9rem;
    font-size: 0.78rem;
  }
  .legal-footer a {
    color: rgba(255,255,255,0.55);
    text-decoration: none;
  }
  .legal-footer a:hover { color: #f8fafc; }

  @media (max-width: 560px) {
    .banner { padding: 1.8rem 1.2rem 4.5rem; }
  }
</style>
</head>
<body>

  <div class="slideshow" id="slideshow"></div>

  <div class="thumb-nav" id="thumb-nav"></div>

  <div class="banner">
    <div class="eyebrow" id="banner-eyebrow">Projekt</div>
    <h1 id="banner-title"></h1>
    <p class="info" id="banner-info"></p>
    <div class="actions">
      <a class="link-btn" id="banner-link" href="#">Mehr erfahren →</a>
      <div class="socials" id="banner-socials"></div>
    </div>
  </div>

  <div class="legal-footer">
    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
    <a href="/apps.html">Apps</a>
  </div>

  <script>
    // Datenquelle für die Slideshow. Sobald echte Fotos vorhanden sind, hier
    // "image": "/images/<datei>.jpg" ergänzen – die Platzhaltergrafik
    // verschwindet dann automatisch, sobald ein Foto hinterlegt ist.
    const slides = [
      {
        key: 'martin-renner',
        icon: '👤',
        eyebrow: 'Über mich',
        title: 'Martin Renner',
        info: 'Kurzer Platzhaltertext über dich – wer du bist und was dich ausmacht.',
        link: '#',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' },
          { label: 'LinkedIn', href: '#' }
        ]
      },
      {
        key: 'kreatief-musical',
        icon: '🎭',
        eyebrow: 'Projekt',
        title: 'Kreatief-Musical',
        info: 'Platzhaltertext: kurze Beschreibung des Projekts Kreatief-Musical.',
        link: '#',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' },
          { label: 'Facebook', href: '#' }
        ]
      },
      {
        key: 'voctails',
        icon: '🎤',
        eyebrow: 'Projekt',
        title: 'Voctails',
        info: 'Platzhaltertext: kurze Beschreibung des Projekts Voctails.',
        link: '#',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' },
          { label: 'YouTube', href: '#' }
        ]
      },
      {
        key: 'lauter-maenner',
        icon: '🎶',
        eyebrow: 'Projekt',
        title: 'Lauter Männer',
        info: 'Platzhaltertext: kurze Beschreibung des Projekts Lauter Männer.',
        link: '#',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' },
          { label: 'Facebook', href: '#' }
        ]
      },
      {
        key: 'fruehstuecks-choerle',
        icon: '☀️',
        eyebrow: 'Projekt',
        title: 'Frühstücks-Chörle',
        info: 'Noten & Unterlagen für das Frühstückschörle findest du direkt hier.',
        link: '/choerle',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' }
        ]
      },
      {
        key: 'veranstaltungstechnik',
        icon: '🎛️',
        eyebrow: 'Dienstleistung',
        title: 'Veranstaltungstechnik',
        info: 'Platzhaltertext: kurze Beschreibung des Angebots Veranstaltungstechnik.',
        link: '#',
        image: null,
        socials: [
          { label: 'Instagram', href: '#' }
        ]
      }
    ];

    const slideshowEl = document.getElementById('slideshow');
    const thumbNavEl = document.getElementById('thumb-nav');
    const bannerEyebrow = document.getElementById('banner-eyebrow');
    const bannerTitle = document.getElementById('banner-title');
    const bannerInfo = document.getElementById('banner-info');
    const bannerLink = document.getElementById('banner-link');
    const bannerSocials = document.getElementById('banner-socials');

    slides.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.dataset.key = s.key;
      if (s.image) {
        div.style.backgroundImage = `url(${s.image})`;
      } else {
        div.innerHTML = `<div class="slide-placeholder grad-${s.key}">
          <div class="ph-icon">${s.icon}</div>
          <div class="ph-label">Foto-Platzhalter · ${s.title}</div>
        </div>`;
      }
      slideshowEl.appendChild(div);

      // Thumbnail-Navigation: kleine Foto-Kacheln aller Projekte als Überblick/Navigation
      const thumb = document.createElement('div');
      thumb.className = 'thumb' + (i === 0 ? ' active' : '');
      if (s.image) {
        thumb.style.backgroundImage = `url(${s.image})`;
      } else {
        thumb.classList.add(`grad-${s.key}`);
      }
      thumb.innerHTML = `<div class="thumb-icon">${s.image ? '' : s.icon}</div><div class="thumb-label">${s.title}</div>`;
      thumb.title = s.title;
      thumb.addEventListener('click', () => goTo(i));
      thumbNavEl.appendChild(thumb);
    });

    const slideEls = document.querySelectorAll('.slide');
    const thumbEls = document.querySelectorAll('.thumb');
    let current = 0;
    let timer = null;

    function render() {
      slideEls.forEach((el, i) => el.classList.toggle('active', i === current));
      thumbEls.forEach((el, i) => el.classList.toggle('active', i === current));
      const s = slides[current];
      bannerEyebrow.textContent = s.eyebrow;
      bannerTitle.textContent = s.title;
      bannerInfo.textContent = s.info;
      bannerLink.href = s.link || '#';
      bannerSocials.innerHTML = s.socials.map(soc =>
        `<a href="${soc.href}" target="_blank" rel="noopener" title="${soc.label}">${soc.label.charAt(0)}</a>`
      ).join('');
    }

    function goTo(i) {
      current = i;
      render();
      restart();
    }

    function next() {
      current = (current + 1) % slides.length;
      render();
    }

    function restart() {
      if (timer) clearInterval(timer);
      timer = setInterval(next, 6000);
    }

    render();
    restart();
  </script>
</body>
</html>
