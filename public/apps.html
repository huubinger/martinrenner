<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps – martinrenner.de</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #f8fafc;
    min-height: 100vh;
    padding: 2.5rem 1rem 5rem;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin-bottom: 0.5rem; }
  p.subtitle { color: #cbd5e1; margin-bottom: 2rem; }
  ul { list-style: none; }
  li { margin-bottom: 0.75rem; }
  a.app-link {
    display: block;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    color: #38bdf8;
    text-decoration: none;
    font-size: 1rem;
    transition: background 0.15s ease;
  }
  a.app-link:hover { background: rgba(255,255,255,0.12); }
  .home-link { display: inline-block; margin-top: 2rem; color: #94a3b8; font-size: 0.9rem; text-decoration: none; }
  .home-link:hover { text-decoration: underline; }

  .cookie-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem 1.2rem;
    background: rgba(15,23,42,0.97);
    border-top: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
  }
  .cookie-banner p {
    color: #e2e8f0;
    font-size: 0.85rem;
    max-width: 640px;
    line-height: 1.5;
    margin: 0;
  }
  .cookie-banner a { color: #38bdf8; }
  .cookie-banner button {
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .cookie-banner button:hover { background: #0ea5e9; }

  .newsletter-box {
    position: relative;
    display: none;
    max-width: 420px;
    margin: 3rem auto 1rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .newsletter-text { font-size: 0.82rem; color: #f8fafc; margin-bottom: 0.5rem; }
  .newsletter-form { display: flex; gap: 0.4rem; }
  .newsletter-form input {
    flex: 1;
    min-width: 0;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #f8fafc;
    font-size: 0.78rem;
    font-family: inherit;
  }
  .newsletter-form button {
    padding: 0.45rem 0.7rem;
    border-radius: 6px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .newsletter-form button:hover { background: #0ea5e9; }
  .newsletter-msg { font-size: 0.72rem; color: #94a3b8; margin-top: 0.4rem; min-height: 1em; }
</style>
</head>
<body>
  <div class="container">
    <h1>🧩 Apps</h1>
    <p class="subtitle">Tools &amp; Anwendungen</p>
    <ul>
      <li><a class="app-link" href="https://jpmr-tool-production.up.railway.app" target="_blank" rel="noopener">JPMR-Tool</a></li>
      <li><a class="app-link" href="https://office-tool-production.up.railway.app" target="_blank" rel="noopener">Office-Tool</a></li>
      <li><a class="app-link" href="https://www.neckarsulmer-kulturkalender.de" target="_blank" rel="noopener">Kulturkalender</a></li>
    </ul>
    <a class="home-link" href="/">&larr; zurück zur Startseite</a>
  </div>

  <div class="cookie-banner" id="cookie-banner">
    <p>Diese Website verwendet ausschließlich technisch notwendige Funktionen – keine Cookies zu Tracking- oder Marketingzwecken. Mehr dazu in der <a href="/datenschutz.html">Datenschutzerklärung</a>.</p>
    <button id="cookie-banner-ok">Verstanden</button>
  </div>
  <script>
    (function () {
      var KEY = 'cookie_notice_ack_v1';
      var banner = document.getElementById('cookie-banner');
      if (banner && !localStorage.getItem(KEY)) {
        banner.style.display = 'flex';
      }
      var btn = document.getElementById('cookie-banner-ok');
      if (btn) {
        btn.addEventListener('click', function () {
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          banner.style.display = 'none';
        });
      }
    })();
  </script>

  <div class="newsletter-box" id="newsletter-box">
    <p class="newsletter-text">📬 Newsletter abonnieren</p>
    <form id="newsletter-form" class="newsletter-form">
      <input type="email" name="email" id="newsletter-email" placeholder="deine@email.de" required>
      <button type="submit">Anmelden</button>
    </form>
    <p class="newsletter-msg" id="newsletter-msg"></p>
  </div>
  <script>
    (function () {
      var box = document.getElementById('newsletter-box');
      if (!box) return;
      box.style.display = 'block';
      var form = document.getElementById('newsletter-form');
      var msg = document.getElementById('newsletter-msg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('newsletter-email').value;
        msg.textContent = 'Wird gesendet …';
        fetch('/api/newsletter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'email=' + encodeURIComponent(email),
        })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            if (result.ok && result.data.ok) {
              msg.textContent = 'Danke fürs Abonnieren!';
              form.style.display = 'none';
            } else {
              msg.textContent = (result.data && result.data.error) || 'Anmeldung fehlgeschlagen.';
            }
          })
          .catch(function () {
            msg.textContent = 'Anmeldung fehlgeschlagen. Bitte später erneut versuchen.';
          });
      });
    })();
  </script>
</body>
</html>
