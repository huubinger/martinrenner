<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps – martinrenner.de</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #f8fafc;
    min-height: 100vh;
    padding: 6.2rem 1rem 5rem;
  }
  .top-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 1.3rem;
    padding: 1.1rem 1.5rem;
    background: linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0) 100%);
    overflow-x: auto;
    white-space: nowrap;
  }
  .top-nav a {
    color: rgba(255,255,255,0.65);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    padding: 0.3rem 0;
    flex: 0 0 auto;
  }
  .top-nav a:hover { color: #f8fafc; }
  .top-nav a.active { color: #38bdf8; }
  .top-nav .nav-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.2); flex: 0 0 auto; }
  @media (max-width: 700px) {
    .top-nav {
      flex-wrap: wrap;
      overflow-x: visible;
      white-space: normal;
      padding: 0.8rem 1rem;
      gap: 0.5rem 0.9rem;
      row-gap: 0.4rem;
      background: rgba(15,23,42,0.72);
      backdrop-filter: blur(6px);
    }
    .top-nav .nav-divider { display: none; }
    .top-nav a { font-size: 0.8rem; padding: 0.15rem 0; }
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); margin-bottom: 0.5rem; }
  p.subtitle { color: #cbd5e1; margin-bottom: 2rem; }
  ul { list-style: none; }
  li { margin-bottom: 0.75rem; }
  a.app-link {
    display: block;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    color: #38bdf8;
    text-decoration: none;
    font-size: 1rem;
    transition: background 0.15s ease;
  }
  a.app-link:hover { background: rgba(255,255,255,0.12); }
  .home-link { display: inline-block; margin-top: 2rem; color: #94a3b8; font-size: 0.9rem; text-decoration: none; }
  .home-link:hover { text-decoration: underline; }

  .cookie-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem 1.2rem;
    background: rgba(15,23,42,0.97);
    border-top: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
  }
  .cookie-banner p {
    color: #e2e8f0;
    font-size: 0.85rem;
    max-width: 640px;
    line-height: 1.5;
    margin: 0;
  }
  .cookie-banner a { color: #38bdf8; }
  .cookie-banner button {
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .cookie-banner button:hover { background: #0ea5e9; }
</style>
</head>
<body>
  <nav class="top-nav" id="top-nav"></nav>
  <div class="container">
    <h1>🧩 Apps</h1>
    <p class="subtitle">Tools &amp; Anwendungen</p>
    <ul>
      <li><a class="app-link" href="https://jpmr-tool-production.up.railway.app" target="_blank" rel="noopener">JPMR-Tool</a></li>
      <li><a class="app-link" href="https://office-tool-production.up.railway.app" target="_blank" rel="noopener">Office-Tool</a></li>
      <li><a class="app-link" href="https://www.neckarsulmer-kulturkalender.de" target="_blank" rel="noopener">Kulturkalender</a></li>
    </ul>
    <a class="home-link" href="/">&larr; zurück zur Startseite</a>
  </div>

  <script>
    (function () {
      function esc(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      fetch('/api/projects')
        .then(function (r) { return r.json(); })
        .then(function (slides) {
          var nav = document.getElementById('top-nav');
          if (!nav || !Array.isArray(slides)) return;
          var html = slides
            .map(function (s) {
              var key = s.id || s.key || s.title;
              return '<a href="/?p=' + encodeURIComponent(key) + '">' + esc(s.title) + '</a>';
            })
            .join('');
          html += '<span class="nav-divider"></span><a href="/kontakt">Kontakt</a>';
          nav.innerHTML = html;
        })
        .catch(function () {});
    })();
  </script>

  <div class="cookie-banner" id="cookie-banner">
    <p>Diese Website verwendet ausschließlich technisch notwendige Funktionen – keine Cookies zu Tracking- oder Marketingzwecken. Mehr dazu in der <a href="/datenschutz.html">Datenschutzerklärung</a>.</p>
    <button id="cookie-banner-ok">Verstanden</button>
  </div>
  <script>
    (function () {
      var KEY = 'cookie_notice_ack_v1';
      var banner = document.getElementById('cookie-banner');
      if (banner && !localStorage.getItem(KEY)) {
        banner.style.display = 'flex';
      }
      var btn = document.getElementById('cookie-banner-ok');
      if (btn) {
        btn.addEventListener('click', function () {
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          banner.style.display = 'none';
        });
      }
    })();
  </script>
</body>
</html>
