<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreatief-Musicals – alle Vorstellungen</title>
  <meta name="description" content="Alle Kreatief-Musicals aus Neckarsulm mit ihren Vorstellungen auf YouTube – sortiert nach Jahr, mit Darsteller-Suche.">
  <link rel="icon" href="/musicals/kreatief_stern.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/musicals/musicals.css">
</head>
<body>
  <header class="hero">
    <div class="spot spot-a"></div>
    <div class="spot spot-b"></div>
    <div class="hero-inner">
      <img class="logo" src="/musicals/kreatief_logo_weiss.png" alt="Kreatief – Kultur im Unterland e.V." width="200" height="129">
      <h1>Kreatief-Musicals</h1>
      <p class="lead">Alle Vorstellungen und Galas zum Nachschauen – vom ersten Mini-Musical bis heute.</p>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Darsteller, Rolle oder Musical suchen …" autocomplete="off" list="namen" aria-label="Suche nach Darsteller, Rolle oder Musical">
        <datalist id="namen"></datalist>
        <button id="q-clear" class="q-clear" type="button" aria-label="Suche löschen" hidden>×</button>
      </div>
      <p class="stats" id="stats"></p>
    </div>
  </header>

  <main>
    <nav class="years" id="years" aria-label="Sprung zu Jahr"></nav>
    <section id="results" class="results" hidden></section>
    <section id="list" class="list"></section>
  </main>

  <footer class="foot">
    <p>Die Aufzeichnungen liegen auf YouTube. Ein Klick auf „Teil abspielen“ öffnet das Video bei YouTube.</p>
    <p>
      <a href="https://www.kreatief-neckarsulm.de" rel="noopener">kreatief-neckarsulm.de</a>
      <a href="https://www.martinrenner.de">martinrenner.de</a>
      <a href="https://www.martinrenner.de/impressum.html">Impressum</a>
      <a href="https://www.martinrenner.de/datenschutz.html">Datenschutz</a>
    </p>
  </footer>

  <script src="/musicals/musicals.js"></script>
</body>
</html>
